name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "server/**"
      - "netlify.toml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FolderCamera.apk

      # Releases 페이지에 APK 올리기 (폰에서 바로 다운로드 가능)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 폴더 카메라 (빌드 ${{ github.run_number }})
          body: 아래 FolderCamera.apk 를 폰에서 눌러 내려받아 설치하세요.
          files: FolderCamera.apk
          make_latest: true
