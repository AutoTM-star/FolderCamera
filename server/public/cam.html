<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폴더 카메라</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="폴더카메라">
<meta name="theme-color" content="#2f6feb">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/open-external.js"></script>
<style>
  :root {
    --bg: #f3f4f7; --card: #ffffff; --text: #1b2130; --muted: #6a7385; --line: #e2e5eb;
    --accent: #2f6feb; --accent-press: #2559c4; --on-accent: #ffffff; --danger: #d92d20; --ok: #12a150;
    --bar: #ffffff; --chip: #eaf0ff; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318; --card: #1a1f27; --text: #e9ecf1; --muted: #98a1b2; --line: #2a313d;
      --accent: #5b8def; --accent-press: #4a78d6; --on-accent: #ffffff; --danger: #f97066; --ok: #47cd89;
      --bar: #161a21; --chip: #222b3b; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bar); border-bottom: 1px solid var(--line);
    padding: env(safe-area-inset-top) 8px 0; }
  .bar { display: flex; align-items: center; min-height: 54px; gap: 4px; }
  .bar .title { flex: 1; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  .bar button { min-height: 44px; padding: 0 10px; border-radius: 10px; font-size: 16px; color: var(--accent); font-weight: 600; }
  .bar button:active { background: var(--chip); }
  #globalStatus { font-size: 13px; color: var(--accent); padding: 0 8px 6px; display: none; }

  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 140px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .list { overflow: hidden; }
  .row { display: flex; align-items: center; min-height: 60px; padding: 0 4px 0 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--chip); }
  .row .name { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .more { width: 48px; height: 48px; font-size: 22px; font-weight: 700; color: var(--muted); border-radius: 50%; }
  .hint { color: var(--muted); font-size: 14px; margin: 10px 4px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .banner { padding: 14px 16px; margin-bottom: 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .banner b { color: var(--accent); }
  .banner .x { margin-left: auto; color: var(--muted); font-size: 18px; padding: 0 4px; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 4; }
  .dock .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { flex: 1; min-height: 56px; border-radius: 14px; font-size: 17px; font-weight: 700; padding: 0 16px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:active { background: var(--accent-press); }
  .btn.ghost { background: var(--card); border: 1px solid var(--line); color: var(--accent); }
  .btn.huge { min-height: 72px; font-size: 20px; }

  .status { font-size: 14px; color: var(--muted); margin: 4px 4px 10px; min-height: 21px; }
  .status .warn { color: var(--danger); }
  .status button { color: var(--accent); font-weight: 600; text-decoration: underline; padding: 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; border-radius: 12px; overflow: hidden; }
  .cell { position: relative; aspect-ratio: 1; background: var(--line); overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .badge { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px;
    padding: 2px 6px; border-radius: 6px; }
  .section { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 4px 8px; }

  /* 시트(입력창) */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 6px; font-size: 19px; }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 14px; white-space: pre-line; }
  .sheet input { width: 100%; font: inherit; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  .sheet .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 6px 2px; }
  .sheet .actions { display: flex; gap: 10px; margin-top: 6px; }

  /* 사진 크게 보기 */
  .viewer { position: fixed; inset: 0; background: #000; z-index: 30; display: flex; flex-direction: column; }
  .viewer .top, .viewer .bottom { color: #fff; display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .viewer .top { padding-top: calc(8px + env(safe-area-inset-top)); }
  .viewer .bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom)); justify-content: space-around; }
  .viewer .top button, .viewer .bottom button, .viewer .bottom a { color: #fff; font-size: 16px; min-height: 44px; padding: 0 12px; text-decoration: none; }
  .viewer .name { flex: 1; font-size: 13px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .viewer .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: pan-y pinch-zoom; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; -webkit-touch-callout: default; }
  .viewer .tip { color: #fff; opacity: .6; font-size: 12px; text-align: center; padding: 0 12px; }

  #toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(20,24,32,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 40;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 35; transition: opacity .25s; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button id="backBtn" hidden>‹ 뒤로</button>
    <div class="title" id="title">📷 폴더 카메라</div>
    <button id="actionBtn" hidden></button>
  </div>
  <div id="globalStatus"></div>
</header>
<main id="view"></main>
<div id="toast"></div>
<div id="flash"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="pickInput" accept="image/*" multiple hidden>

<script>
"use strict";
// ───────── 기본 도구 ─────────
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const BAD = /[\\/:*?"<>|#%]/;

function nameProblem(n) {
  if (!n) return "이름을 입력하세요";
  if (n.length > 80) return "이름이 너무 길어요";
  if (BAD.test(n) || n.startsWith(".") || n.endsWith(".")) return '/ \\ : * ? " < > | # % 와 맨 앞·뒤 . 은 쓸 수 없어요';
  return null;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

let sites = store.get("fc_sites", []);      // [{code, name}]
let myName = store.get("fc_name", "");
let current = null;                          // {code, folder} 촬영 중인 폴더

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error(data.error || `서버 오류 (${res.status})`);
    e.status = res.status;
    throw e;
  }
  return data;
}

let toastTimer;
function toast(msg, ms = 2200) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

function flash() {
  const f = $("#flash");
  f.style.transition = "none"; f.style.opacity = ".7";
  requestAnimationFrame(() => { f.style.transition = "opacity .25s"; f.style.opacity = "0"; });
  if (navigator.vibrate) navigator.vibrate(40);   // 안드로이드만 (아이폰 사파리는 진동 미지원)
}

// ───────── 업로드 대기열 (IndexedDB: 앱을 닫아도 남음) ─────────
let dbPromise;
function db() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const r = indexedDB.open("foldercamera", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  return dbPromise;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const t = d.transaction("photos", mode);
    const req = fn(t.objectStore("photos"));
    t.oncomplete = () => resolve(req ? req.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const queue = {
  all: () => tx("readonly", (s) => s.getAll()),
  add: (rec) => tx("readwrite", (s) => s.add(rec)),
  put: (rec) => tx("readwrite", (s) => s.put(rec)),
  del: (id) => tx("readwrite", (s) => s.delete(id)),
};

// ───────── 사진 처리 ─────────
async function decodeImage(blob) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(blob, { imageOrientation: "from-image" }); } catch (e) {}
  }
  return await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}
async function resizeJpeg(blob, maxSide, quality) {
  const im = await decodeImage(blob);
  const s = Math.min(1, maxSide / Math.max(im.width, im.height));
  const c = document.createElement("canvas");
  c.width = Math.round(im.width * s);
  c.height = Math.round(im.height * s);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  return await new Promise((r) => c.toBlob(r, "image/jpeg", quality));
}
async function makeThumb(blob) {
  try { return await resizeJpeg(blob, 360, 0.75); } catch (e) { return null; }
}
async function shrinkTo(blob, maxBytes) {
  if (blob.size <= maxBytes) return { blob, converted: false };
  let side = 4032, out = blob;
  for (let i = 0; i < 6; i++) {
    out = await resizeJpeg(blob, side, 0.85);
    if (out.size <= maxBytes) break;
    side = Math.round(side * 0.8);
  }
  return { blob: out, converted: true };
}

function pad(n, w = 2) { return String(n).padStart(w, "0"); }
function photoName(type) {
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${pad(d.getMilliseconds(), 3)}`;
  const ext = /heic|heif/i.test(type) ? ".heic" : /png/i.test(type) ? ".png" : /webp/i.test(type) ? ".webp" : ".jpg";
  const who = myName ? myName.replace(/[\\/:*?"<>|#%\s]/g, "") + "_" : "";
  return `${who}IMG_${stamp}${ext}`;
}

// 사진 1장 OneDrive로 올리기: 폰 → OneDrive 직접. 브라우저가 막히면 서버를 거쳐서
async function uploadOne(rec) {
  const size = rec.blob.size;
  const { uploadUrl } = await api("POST", "/api/upload", { code: rec.code, folder: rec.folder, fileName: rec.name });
  try {
    const r = await fetch(uploadUrl, { method: "PUT", headers: { "Content-Range": `bytes 0-${size - 1}/${size}` }, body: rec.blob });
    if (r.ok) return;
    if (r.status >= 500) { const e = new Error("OneDrive 일시 오류"); e.status = r.status; throw e; }
  } catch (e) {
    if (e.status) throw e;   // 네트워크/브라우저 제한이면 아래 방법으로
  }
  const { blob, converted } = await shrinkTo(rec.blob, 4 * 1024 * 1024);
  const name = converted ? rec.name.replace(/\.(heic|heif|png|webp)$/i, ".jpg") : rec.name;
  const q = new URLSearchParams({ code: rec.code, folder: rec.folder, name });
  const r2 = await fetch("/api/upload-file?" + q, { method: "POST", headers: { "content-type": blob.type || "image/jpeg" }, body: blob });
  if (!r2.ok) {
    const d = await r2.json().catch(() => ({}));
    const e = new Error(d.error || `업로드 실패 (${r2.status})`);
    e.status = r2.status;
    throw e;
  }
}

let busy = false;
async function processQueue() {
  if (busy || !navigator.onLine) return refreshStatus();
  busy = true;
  let uploaded = 0;
  try {
    const list = (await queue.all()).filter((r) => r.status === "pending").sort((a, b) => a.id - b.id);
    for (const rec of list) {
      try {
        await uploadOne(rec);
        await queue.del(rec.id);
        uploaded++;
      } catch (e) {
        const permanent = e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429;
        if (permanent) { rec.status = "failed"; rec.error = e.message; await queue.put(rec); }
        else break;    // 인터넷/서버 문제 → 나중에 다시
      }
      refreshStatus();
    }
  } finally {
    busy = false;
    refreshStatus();
    if (uploaded) {
      toast(`☁ OneDrive에 ${uploaded}장 올라갔어요`);
      if (current) loadServerPhotos();
    }
  }
}

async function retryFailed() {
  const list = (await queue.all()).filter((r) => r.status === "failed");
  for (const rec of list) { rec.status = "pending"; delete rec.error; await queue.put(rec); }
  processQueue();
}

async function refreshStatus() {
  const all = await queue.all().catch(() => []);
  const waiting = all.filter((r) => r.status === "pending").length;
  const failed = all.filter((r) => r.status === "failed").length;
  const g = $("#globalStatus");
  if (waiting || failed) {
    g.style.display = "block";
    g.textContent = (waiting ? `☁ 업로드 대기 ${waiting}장` : "") + (failed ? `  ⚠ 실패 ${failed}장` : "") +
      (!navigator.onLine ? "  (인터넷 연결 기다리는 중)" : "");
  } else {
    g.style.display = "none";
  }
  if (current) renderLocal(all);
}

// ───────── 화면 공통 ─────────
function setBar(title, opts = {}) {
  $("#title").textContent = title;
  const back = $("#backBtn"), action = $("#actionBtn");
  back.hidden = !opts.back;
  back.onclick = opts.back || null;
  action.hidden = !opts.action;
  if (opts.action) { action.textContent = opts.action.label; action.onclick = opts.action.fn; }
}

function go(...parts) { location.hash = "#/" + parts.map(encodeURIComponent).join("/"); }

function ask({ title, message = "", placeholder = "", value = "", ok = "확인", validate }) {
  return new Promise((resolve) => {
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3><p>${esc(message)}</p>
      <input type="text" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off">
      <div class="err"></div>
      <div class="actions"><button class="btn ghost" data-x>취소</button><button class="btn primary" data-ok>${esc(ok)}</button></div></div>`;
    document.body.appendChild(scrim);
    const input = $("input", scrim), err = $(".err", scrim), okBtn = $("[data-ok]", scrim);
    setTimeout(() => input.focus(), 50);
    const close = (v) => { scrim.remove(); resolve(v); };
    $("[data-x]", scrim).onclick = () => close(null);
    scrim.onclick = (e) => { if (e.target === scrim) close(null); };
    const submit = async () => {
      const v = input.value.trim().replace(/\s+/g, " ");
      if (validate) {
        okBtn.disabled = true;
        try {
          const problem = await validate(v);
          if (problem) { err.textContent = problem; return; }
        } finally { okBtn.disabled = false; }
      }
      close(v);
    };
    okBtn.onclick = submit;
    input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  });
}

// 홈 화면에 추가할 때 참여한 현장이 같이 저장되도록 주소에 기록 (아이폰은 홈 화면 앱의 저장공간이 따로라서)
function syncUrl() {
  const codes = sites.map((s) => s.code).join(",");
  history.replaceState(null, "", "/cam" + (codes ? "?sites=" + codes : "") + location.hash);
}
function saveSites() { store.set("fc_sites", sites); syncUrl(); }
function addSite(site) {
  sites = sites.filter((s) => s.code !== site.code).concat({ code: site.code, name: site.name });
  saveSites();
}

async function askName(first) {
  const v = await ask({
    title: first ? "처음 오셨네요! 이름을 알려주세요" : "내 이름",
    message: "찍은 사진 파일 이름 앞에 붙어서, 누가 찍었는지 알 수 있어요.",
    placeholder: "예: 김준한",
    value: myName,
    ok: "저장",
  });
  if (v != null) {
    myName = v.replace(/[\\/:*?"<>|#%]/g, "").slice(0, 30);
    store.set("fc_name", myName);
    route();
  }
}

function parseInvite(text) {
  const t = String(text || "").trim();
  const m = t.match(/\/join\/([A-Za-z0-9]{4,12})/) || t.match(/[?&]join=([A-Za-z0-9]{4,12})/) || t.match(/\b([A-Za-z0-9]{6})\b/);
  return m ? m[1].toUpperCase() : null;
}

async function joinCode(code) {
  const r = await api("POST", "/api/join", { code });
  addSite(r);
  toast(`'${r.name}' 현장에 참여했어요`);
  go("s", r.code);
}

async function askJoin(prefill = "") {
  await ask({
    title: "현장 참여",
    message: "관리자에게 받은 초대 링크나 초대 코드(6자리)를 넣으세요.",
    placeholder: "예: 2KDNLT",
    value: prefill,
    ok: "참여",
    validate: async (v) => {
      const code = parseInvite(v);
      if (!code) return "초대 코드 6자리를 확인해 주세요";
      try { await joinCode(code); return null; } catch (e) { return e.message; }
    },
  });
}

// ───────── 화면: 홈 (현장 목록) ─────────
function homeView() {
  current = null;
  setBar("📷 폴더 카메라", { action: { label: "👤 " + (myName || "이름"), fn: () => askName(false) } });
  const showBanner = isIOS && !isStandalone && !store.get("fc_hide_banner", false);
  const banner = showBanner ? `<div class="card banner"><div>📲 <b>홈 화면에 추가</b>하면 앱처럼 쓸 수 있어요.<br>
      사파리 아래쪽 <b>공유 버튼(⬆︎)</b> → <b>홈 화면에 추가</b></div><button class="x" id="hideBanner">✕</button></div>` : "";
  const rows = sites.map((s) => `<div class="row" data-code="${esc(s.code)}"><span class="name">🏗 ${esc(s.name)}</span><button class="more" data-more="${esc(s.code)}">⋮</button></div>`).join("");
  $("#view").innerHTML = `${banner}
    ${sites.length ? `<div class="card list">${rows}</div><p class="hint">현장을 누르면 폴더가 나와요. 사진은 관리자 OneDrive로 자동으로 모여요.</p>`
      : `<div class="empty">아직 참여한 현장이 없어요.<br><br>받은 <b>초대 링크</b>를 누르거나,<br>아래 <b>현장 참여</b>에 초대 코드를 넣으세요.</div>`}
    <div class="dock"><div class="inner"><button class="btn primary" id="joinBtn">☁ 현장 참여</button></div></div>`;
  $("#joinBtn").onclick = () => askJoin();
  const hb = $("#hideBanner");
  if (hb) hb.onclick = () => { store.set("fc_hide_banner", true); homeView(); };
  document.querySelectorAll(".row[data-code]").forEach((row) => {
    row.onclick = () => go("s", row.dataset.code);
  });
  document.querySelectorAll("[data-more]").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const s = sites.find((x) => x.code === b.dataset.more);
      if (s && confirm(`'${s.name}' 현장에서 나갈까요?\n(이 기기 목록에서만 빠지고, 올라간 사진은 그대로예요)`)) {
        sites = sites.filter((x) => x.code !== s.code);
        saveSites();
        homeView();
      }
    };
  });
}

// ───────── 화면: 현장 (폴더 목록) ─────────
async function siteView(code) {
  current = null;
  const site = sites.find((s) => s.code === code);
  if (!site) return go();
  setBar("🏗 " + site.name, { back: () => go(), action: { label: "👥 초대", fn: () => shareInvite(site) } });
  const cacheKey = "fc_folders_" + code;
  const render = (folders, status) => {
    if (location.hash !== "#/s/" + encodeURIComponent(code)) return;
    const rows = folders.map((f) => `<div class="row" data-f="${esc(f)}"><span class="name">📁 ${esc(f)}</span><button class="more" data-more="${esc(f)}">⋮</button></div>`).join("");
    $("#view").innerHTML = `<div class="status">${status}</div>
      ${folders.length ? `<div class="card list">${rows}</div>` : `<div class="empty">아직 폴더가 없어요.<br>아래 버튼으로 만들어 보세요.</div>`}
      <div class="dock"><div class="inner"><button class="btn primary" id="newFolder">+ 새 폴더</button></div></div>`;
    $("#newFolder").onclick = () => newFolder(site, folders);
    document.querySelectorAll(".row[data-f]").forEach((row) => { row.onclick = () => go("s", code, "f", row.dataset.f); });
    document.querySelectorAll("[data-more]").forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); deleteFolder(site, b.dataset.more); };
    });
  };
  render(store.get(cacheKey, []), "☁ 폴더 목록을 불러오는 중…");
  try {
    const r = await api("GET", "/api/folders?code=" + encodeURIComponent(code));
    store.set(cacheKey, r.folders);
    render(r.folders, "☁ 폴더를 누르고 찍으면 OneDrive로 자동 업로드돼요");
  } catch (e) {
    render(store.get(cacheKey, []), e.status ? `<span class="warn">⚠ ${esc(e.message)}</span>` : "⚠ 인터넷 연결이 없어 저장된 목록을 보여줘요");
  }
}

async function newFolder(site, folders) {
  const name = await ask({
    title: "새 폴더 (모든 참여자에게 보여요)",
    placeholder: "예: 12 추가사진",
    ok: "만들기",
    validate: async (v) => {
      const p = nameProblem(v);
      if (p) return p;
      if (folders.some((f) => f.toLowerCase() === v.toLowerCase())) return "이미 있는 폴더예요";
      try { await api("POST", "/api/folders", { code: site.code, name: v }); return null; }
      catch (e) { return e.status ? e.message : "인터넷 연결을 확인하세요"; }
    },
  });
  if (name) go("s", site.code, "f", name);
}

async function deleteFolder(site, folder) {
  if (!confirm(`'${folder}' 폴더를 삭제할까요?\n모든 참여자의 목록에서 지워져요.\n사진이 하나라도 있는 폴더는 지울 수 없어요.`)) return;
  try {
    await api("DELETE", `/api/folders?code=${encodeURIComponent(site.code)}&name=${encodeURIComponent(folder)}`);
    toast(`'${folder}' 폴더를 삭제했어요`);
    siteView(site.code);
  } catch (e) {
    alert(e.status ? e.message : "인터넷 연결을 확인하세요");
  }
}

async function shareInvite(site) {
  const link = `${location.origin}/join/${site.code}`;
  const text = `[폴더 카메라] ${site.name} 현장 사진 공유\n아래 링크 하나로 앱 설치(안드로이드) 또는 웹앱(아이폰) + 현장 참여까지 할 수 있어요.\n${link}\n(초대 코드: ${site.code})`;
  if (navigator.share) {
    try { await navigator.share({ text }); } catch (e) {}
  } else {
    try { await navigator.clipboard.writeText(text); toast("초대 메시지를 복사했어요"); } catch (e) { prompt("복사해서 보내세요", text); }
  }
}

// ───────── 화면: 폴더 (촬영 + 사진) ─────────
let serverPhotos = [];
let localUrls = [];

function folderView(code, folder) {
  const site = sites.find((s) => s.code === code);
  if (!site) return go();
  current = { code, folder, site };
  serverPhotos = [];
  setBar("📁 " + folder, { back: () => go("s", code) });
  $("#view").innerHTML = `
    <div class="status">🏗 ${esc(site.name)} › ${esc(folder)}</div>
    <div class="section" id="localTitle" hidden>이 기기에서 올리는 중</div>
    <div class="grid" id="localGrid"></div>
    <div class="section" id="serverTitle" style="display:flex;align-items:center">OneDrive에 올라간 사진
      <button id="reloadBtn" style="margin-left:auto;color:var(--accent);font-weight:700;font-size:14px;padding:6px 4px">↻ 새로고침</button></div>
    <div class="status" id="serverStatus">불러오는 중…</div>
    <div class="grid" id="serverGrid"></div>
    <div class="dock"><div class="inner">
      <button class="btn ghost" id="pickBtn" style="flex:0 0 30%">🖼 고르기</button>
      <button class="btn primary huge" id="shootBtn">📷 촬영</button>
    </div></div>`;
  $("#shootBtn").onclick = () => { $("#camInput").value = ""; $("#camInput").click(); };
  $("#pickBtn").onclick = () => { $("#pickInput").value = ""; $("#pickInput").click(); };
  $("#reloadBtn").onclick = () => { $("#serverStatus").textContent = "불러오는 중…"; loadServerPhotos(); };
  refreshStatus();
  loadServerPhotos();
}

async function handleFiles(files) {
  if (!current || !files || !files.length) return;
  const { code, folder } = current;
  flash();
  for (const file of files) {
    const blob = new Blob([file], { type: file.type || "image/jpeg" });
    const thumb = await makeThumb(blob);
    await queue.add({ code, folder, name: photoName(blob.type), blob, thumb, status: "pending", created: Date.now() });
  }
  toast(files.length > 1 ? `${files.length}장 저장 · OneDrive로 올리는 중` : "📷 저장됨 · OneDrive로 올리는 중");
  refreshStatus();
  processQueue();
}
$("#camInput").onchange = (e) => handleFiles(e.target.files);
$("#pickInput").onchange = (e) => handleFiles(e.target.files);

function renderLocal(all) {
  const grid = $("#localGrid");
  if (!grid || !current) return;
  localUrls.forEach((u) => URL.revokeObjectURL(u));
  localUrls = [];
  const mine = all.filter((r) => r.code === current.code && r.folder === current.folder).sort((a, b) => b.id - a.id);
  $("#localTitle").hidden = mine.length === 0;
  const failed = mine.filter((r) => r.status === "failed").length;
  grid.innerHTML = mine.map((r) => {
    const src = r.thumb ? URL.createObjectURL(r.thumb) : "";
    if (src) localUrls.push(src);
    const badge = r.status === "failed" ? "⚠ 실패" : "⏳ 대기";
    return `<div class="cell" data-local="${r.id}">${src ? `<img src="${src}" alt="">` : ""}<span class="badge">${badge}</span></div>`;
  }).join("");
  if (failed) {
    const t = $("#localTitle");
    t.innerHTML = `이 기기에서 올리는 중 · <span style="color:var(--danger)">실패 ${failed}장</span> <button id="retryBtn" style="color:var(--accent);font-weight:700">다시 시도</button>`;
    $("#retryBtn").onclick = retryFailed;
  } else {
    $("#localTitle").textContent = "이 기기에서 올리는 중";
  }
  grid.querySelectorAll("[data-local]").forEach((cell) => {
    cell.onclick = () => {
      const rec = mine.find((r) => String(r.id) === cell.dataset.local);
      if (rec) openViewer([{ local: rec }], 0);
    };
  });
}

async function loadServerPhotos() {
  if (!current) return;
  const { code, folder } = current;
  try {
    const r = await api("GET", `/api/photos?code=${encodeURIComponent(code)}&folder=${encodeURIComponent(folder)}`);
    if (!current || current.code !== code || current.folder !== folder) return;
    serverPhotos = r.photos;
    $("#serverStatus").textContent = serverPhotos.length ? `${serverPhotos.length}장 · 모든 참여자가 올린 사진` : "아직 올라간 사진이 없어요.";
    $("#serverGrid").innerHTML = serverPhotos.map((p, i) =>
      `<div class="cell" data-i="${i}">${p.small ? `<img src="${esc(p.small)}" alt="" loading="lazy">` : ""}</div>`).join("");
    document.querySelectorAll("#serverGrid [data-i]").forEach((cell) => {
      cell.onclick = () => openViewer(serverPhotos.map((p) => ({ server: p })), Number(cell.dataset.i));
    });
  } catch (e) {
    const s = $("#serverStatus");
    if (s) s.textContent = e.status ? "⚠ " + e.message : "⚠ 인터넷 연결이 없어요";
  }
}

// ───────── 사진 크게 보기 ─────────
function openViewer(items, index) {
  const el = document.createElement("div");
  el.className = "viewer";
  el.innerHTML = `<div class="top"><button data-close>‹ 닫기</button><span class="pos"></span><span class="name"></span></div>
    <div class="stage"><img alt=""></div>
    <div class="tip">옆으로 밀어서 넘기기 · 사진을 길게 누르면 '사진 앱에 저장'</div>
    <div class="bottom"></div>`;
  document.body.appendChild(el);
  let i = index, objectUrl = null;
  const img = $("img", el);
  const show = () => {
    const it = items[i];
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    $(".pos", el).textContent = `${i + 1} / ${items.length}`;
    const bottom = $(".bottom", el);
    if (it.local) {
      objectUrl = URL.createObjectURL(it.local.blob);
      img.src = objectUrl;
      $(".name", el).textContent = it.local.name;
      bottom.innerHTML = `<button data-save>📥 사진 앱에 저장</button><button data-del>🗑 올리기 취소</button>`;
      $("[data-save]", el).onclick = () => saveToPhotos(it.local.blob, it.local.name);
      $("[data-del]", el).onclick = async () => {
        if (!confirm("이 사진을 올리지 않고 지울까요?")) return;
        await queue.del(it.local.id);
        el.remove(); refreshStatus();
      };
    } else {
      const p = it.server;
      img.src = p.large || p.small || "";
      if (p.full) { const hi = new Image(); hi.onload = () => { if (items[i] === it) img.src = p.full; }; hi.src = p.full; }
      $(".name", el).textContent = p.name;
      bottom.innerHTML = p.full ? `<a href="${esc(p.full)}" target="_blank" rel="noopener">🔍 원본 열기</a>` : "";
    }
  };
  $("[data-close]", el).onclick = () => { if (objectUrl) URL.revokeObjectURL(objectUrl); el.remove(); };
  let sx = null, sy = null;
  const stage = $(".stage", el);
  stage.addEventListener("touchstart", (e) => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      const n = dx < 0 ? i + 1 : i - 1;
      if (n >= 0 && n < items.length) { i = n; show(); }
    }
    sx = null;
  });
  show();
}

async function saveToPhotos(blob, name) {
  const file = new File([blob], name, { type: blob.type || "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ───────── 시작 ─────────
function route() {
  const parts = (location.hash.slice(2) || "").split("/").filter(Boolean).map(decodeURIComponent);
  if (parts[0] === "s" && parts[1]) {
    if (parts[2] === "f" && parts[3]) return folderView(parts[1], parts[3]);
    return siteView(parts[1]);
  }
  return homeView();
}
window.addEventListener("hashchange", route);
window.addEventListener("online", processQueue);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") processQueue(); });

(async function start() {
  const qs = new URLSearchParams(location.search);
  const join = (qs.get("join") || "").toUpperCase();
  const listed = (qs.get("sites") || "").split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
  // 홈 화면 앱으로 처음 열렸을 때: 주소에 적힌 현장 자동 복원
  for (const code of listed) {
    if (!sites.some((s) => s.code === code)) {
      try { addSite(await api("POST", "/api/join", { code })); } catch (e) {}
    }
  }
  syncUrl();
  route();
  processQueue();
  setInterval(processQueue, 30000);
  // 폴더 화면을 보고 있으면 다른 사람이 올린 사진도 20초마다 새로 불러오기
  setInterval(() => { if (current && document.visibilityState === "visible") loadServerPhotos(); }, 20000);
  if (!myName) await askName(true);
  if (join) {
    if (sites.some((s) => s.code === join)) go("s", join);
    else { try { await joinCode(join); } catch (e) { askJoin(join); } }
  }
})();
</script>
