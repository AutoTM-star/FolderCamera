<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폴더 카메라 초대</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6eb; --accent: #2f6feb; --chip: #eef3ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #98a2b3; --line: #2c3340; --accent: #5b8def; --chip: #232c3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .code { display: inline-block; background: var(--chip); border-radius: 8px; padding: 4px 12px;
    font: 700 24px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 4px; }
  .btn { display: block; text-align: center; text-decoration: none; font-weight: 700; border-radius: 10px;
    padding: 14px; margin-top: 12px; background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .step { font-weight: 700; }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>📷 폴더 카메라 현장 초대</h1>

  <div class="card">
    초대 코드<br>
    <span class="code" id="code">------</span>
  </div>

  <div class="card">
    <div class="step">1. 앱 설치 (처음 한 번만)</div>
    <a class="btn ghost" href="https://github.com/AutoTM-star/FolderCamera/releases/latest/download/FolderCamera.apk">앱 내려받기 (APK)</a>
    <p class="muted">내려받은 파일을 눌러 설치하세요. "출처를 알 수 없는 앱" 허용이 필요할 수 있어요.
      다운로드가 멈추면 이 페이지를 Chrome에서 열어 주세요.</p>
  </div>

  <div class="card">
    <div class="step">2. 현장 참여</div>
    <a class="btn" id="openApp" href="#">앱에서 바로 참여하기</a>
    <p class="muted">버튼이 안 되면: 앱 → <b>현장 참여</b> → 이 페이지 주소를 붙여넣거나 위 코드를 입력하세요.</p>
  </div>
</main>
<script>
  const code = (location.pathname.split("/").filter(Boolean).pop() || "").toUpperCase();
  document.getElementById("code").textContent = code || "------";
  document.getElementById("openApp").href =
    "foldercamera://join?code=" + encodeURIComponent(code) + "&server=" + encodeURIComponent(location.origin);
</script>
</body>
</html>
